<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Три варианта сайта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bar:#14141c;--text:#f1f2f8;--muted:#a3a6bb;--chip:#262633;--ground:#0e0e14}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ground);color:var(--text);font-family:"Golos Text",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--bar);border-bottom:1px solid #2a2a38}
.title{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap}
.title span{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:0;background:var(--chip);color:var(--text);font:600 14px "Golos Text",system-ui,sans-serif;cursor:pointer;transition:background .15s,color .15s}
.tab i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tab:hover{background:#33334a}
.tab[aria-selected="true"]{background:var(--text);color:var(--bar)}
.tab:focus-visible{outline:2px solid #c6f43a;outline-offset:2px}
.open{flex:none;color:var(--muted);font-size:13px;text-decoration:none;white-space:nowrap}
.open:hover{color:var(--text)}
.stage{flex:1;position:relative;background:#fff}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}
iframe.on{display:block}
@media (max-width:720px){
  .bar{flex-wrap:wrap;gap:8px 12px;padding:10px 12px}
  .tabs{margin-left:0;width:100%}
  .open{display:none}
  .tab{height:34px;padding:0 12px;font-size:13px}
}
</style>
</head>
<body>
<header class="bar">
  <div class="title">Soft Skills Lab<span>Три варианта дизайна · макеты</span></div>
  <nav class="tabs" role="tablist" aria-label="Варианты">
    <button class="tab" role="tab" data-id="molecule" style="--c:#ff4733"><i></i>Молекула</button>
    <button class="tab" role="tab" data-id="notebook" style="--c:#1f3fc4"><i></i>Журнал опытов</button>
    <button class="tab" role="tab" data-id="chain" style="--c:#c6f43a"><i></i>Цепная реакция</button>
  </nav>
  <a class="open" id="open" href="a-molecule.html" target="_blank" rel="noopener">Открыть отдельно ↗</a>
</header>
<main class="stage">
  <iframe data-id="molecule" title="Вариант «Молекула»" data-src="a-molecule.html"></iframe>
  <iframe data-id="notebook" title="Вариант «Журнал опытов»" data-src="b-notebook.html"></iframe>
  <iframe data-id="chain" title="Вариант «Цепная реакция»" data-src="c-chain.html"></iframe>
</main>
<script>
(() => {
  const tabs=[...document.querySelectorAll('.tab')], frames=[...document.querySelectorAll('iframe')], open=document.getElementById('open');
  const ids=tabs.map(t=>t.dataset.id);
  function show(id){
    if(!ids.includes(id)) id='molecule';
    tabs.forEach(t=>t.setAttribute('aria-selected',String(t.dataset.id===id)));
    frames.forEach(f=>{const on=f.dataset.id===id;if(on&&!f.src)f.src=f.dataset.src;f.classList.toggle('on',on)});
    open.href=frames.find(f=>f.dataset.id===id).dataset.src;
  }
  tabs.forEach(t=>t.addEventListener('click',()=>{location.hash=t.dataset.id;show(t.dataset.id)}));
  addEventListener('hashchange',()=>show(location.hash.slice(1)));
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
